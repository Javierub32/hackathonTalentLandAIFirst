<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Al curro · Post cuadrado</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { background: var(--primary); color: var(--on-primary); }
  .lienzo { width: 1080px; height: 1080px; padding: 78px 90px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .cabecera {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 28px; border-bottom: 1px solid oklch(0.985 0.005 95 / 35%); padding-bottom: 18px;
  }
  .cabecera .marca { font-family: var(--serif); font-weight: 700; font-size: 40px; }
  h1 { font-size: 104px; }
  h1 span { color: var(--soft); }
  .pie { font-size: 32px; line-height: 1.35; }
  .pie b { font-weight: 600; }
</style>
</head>
<body>
<main class="lienzo">
  <div class="cabecera"><span class="marca">Al curro</span><span>Málaga</span></div>
  <h1>Sabes hacer<br>el trabajo.<br><span>Que tu currículum<br>también lo diga.</span></h1>
  <p class="pie">Para mayores de 45 que buscan trabajo.<br><b>Pregunta por Al curro a tu orientador del IMFE.</b></p>
</main>
</body>
</html>
